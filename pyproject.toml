[project]
name = "neo4j-agno-agent"
version = "2.0.0"
description = "福祉の共有層（事業所・行政・制度）の Neo4j — WAM NET の取得・取り込み・棚卸し"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.15",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "openpyxl>=3.1",
]

# 2026-10-31: 個人層のアプリ（api/・frontend/・lib/ ほか）は archive/personal-layer-2026-10/ に退避した。
# 旧 pyproject（agno・fastapi・streamlit など）と uv.lock・requirements.lock・Dockerfile も同フォルダにある。
# このファイルはパッケージを作らない。`uv run --with ...` でも、`uv sync` してからの `uv run` でも動く。
[tool.uv]
package = false
